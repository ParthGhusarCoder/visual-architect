<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Visual Architect — Review Canvas</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f5;--panel:#fff;--text:#171717;--muted:#686868;--line:#dadad6;--accent:#3659e3;--selected:#fff4bf}@media(prefers-color-scheme:dark){:root{--bg:#111;--panel:#191919;--text:#f1f1ef;--muted:#a7a7a1;--line:#353535;--selected:#4a411e}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,textarea{font:inherit}.app{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 340px}.main{min-width:0;display:grid;grid-template-rows:auto 1fr}.bar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}.bar strong{margin-right:auto}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer}.btn:hover{border-color:var(--muted)}.canvas-wrap{overflow:hidden;position:relative}.canvas{width:100%;height:100%;transform-origin:0 0;cursor:grab}.canvas.dragging{cursor:grabbing}.canvas svg{width:100%;height:100%;min-width:900px;min-height:600px}.side{border-left:1px solid var(--line);background:var(--panel);padding:18px;overflow:auto}.eyebrow{text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:11px}.selection{font-size:18px;font-weight:650;margin:5px 0 14px}.hint{color:var(--muted);font-size:13px}.comment{width:100%;min-height:110px;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--bg);color:var(--text);resize:vertical}.primary{width:100%;border:0;border-radius:9px;padding:9px 12px;background:var(--accent);color:white;font-weight:650;cursor:pointer;margin-top:8px}.feedback{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.item{border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0}.item b{display:block}.item small{color:var(--muted)}[data-va-id]{cursor:pointer;transition:filter .12s ease,opacity .12s ease}[data-va-id].va-selected{filter:drop-shadow(0 0 5px rgba(54,89,227,.45))}[data-va-id].va-selected>rect,[data-va-id].va-selected>path,[data-va-id].va-selected>circle{stroke:var(--accent)!important;stroke-width:3!important}.empty{padding:12px 0;color:var(--muted)}@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:65vh auto}.side{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <section class="main">
    <header class="bar"><strong>School ERP — Example Architecture</strong><button class="btn" id="zoomOut">−</button><button class="btn" id="zoomIn">+</button><button class="btn" id="reset">Fit</button></header>
    <div class="canvas-wrap" id="wrap">
      <div class="canvas" id="canvas">
        <svg viewBox="0 0 1100 680" role="img" aria-labelledby="va-title va-desc">
          <title id="va-title">Example School ERP architecture</title><desc id="va-desc">Clients connect to an API that uses core modules and a primary database.</desc>
          <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>
          <rect width="1100" height="680" fill="transparent"/>
          <text x="70" y="72" font-size="30" font-weight="700" fill="currentColor">School ERP Architecture</text>
          <text x="70" y="100" font-size="15" fill="currentColor" opacity=".6">Example canvas — replace with the real diagram.</text>
          <g data-va-id="client-admin" data-va-label="Admin Portal"><rect x="70" y="180" width="180" height="86" rx="14" fill="var(--panel)" stroke="var(--line)"/><text x="160" y="218" text-anchor="middle" font-weight="650" fill="currentColor">Admin Portal</text><text x="160" y="241" text-anchor="middle" font-size="12" opacity=".6" fill="currentColor">Web client</text></g>
          <g data-va-id="client-parent" data-va-label="Parent App"><rect x="70" y="330" width="180" height="86" rx="14" fill="var(--panel)" stroke="var(--line)"/><text x="160" y="368" text-anchor="middle" font-weight="650" fill="currentColor">Parent App</text><text x="160" y="391" text-anchor="middle" font-size="12" opacity=".6" fill="currentColor">Mobile client</text></g>
          <g data-va-id="api-core" data-va-label="ERP API"><rect x="390" y="250" width="220" height="110" rx="16" fill="var(--panel)" stroke="var(--line)"/><text x="500" y="296" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">ERP API</text><text x="500" y="324" text-anchor="middle" font-size="12" opacity=".6" fill="currentColor">Auth • Attendance • Fees</text></g>
          <g data-va-id="db-primary" data-va-label="Primary Database"><rect x="770" y="250" width="220" height="110" rx="16" fill="var(--panel)" stroke="var(--line)"/><text x="880" y="296" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">Primary Database</text><text x="880" y="324" text-anchor="middle" font-size="12" opacity=".6" fill="currentColor">Students • Finance • Attendance</text></g>
          <g data-va-id="edge-admin-api" data-va-label="Admin to ERP API"><path d="M250 223 C310 223 330 285 390 295" fill="none" stroke="currentColor" opacity=".55" stroke-width="2" marker-end="url(#arrow)"/></g>
          <g data-va-id="edge-parent-api" data-va-label="Parent App to ERP API"><path d="M250 373 C310 373 330 330 390 315" fill="none" stroke="currentColor" opacity=".55" stroke-width="2" marker-end="url(#arrow)"/></g>
          <g data-va-id="edge-api-db" data-va-label="ERP API to Primary Database"><path d="M610 305 L770 305" fill="none" stroke="currentColor" opacity=".55" stroke-width="2" marker-end="url(#arrow)"/></g>
        </svg>
      </div>
    </div>
  </section>
  <aside class="side">
    <div class="eyebrow">Selected element</div><div class="selection" id="selected">Nothing selected</div>
    <p class="hint">Click a node or connector, add precise feedback, then export the review JSON for your AI agent.</p>
    <textarea class="comment" id="comment" placeholder="Example: Rename this to Payment Service and show the webhook flow."></textarea>
    <button class="primary" id="add">Add feedback</button>
    <div class="feedback"><div class="eyebrow">Review feedback</div><div id="items" class="empty">No feedback yet.</div><button class="btn" id="copy" style="width:100%;margin-top:8px">Copy feedback JSON</button><button class="btn" id="download" style="width:100%;margin-top:8px">Download feedback JSON</button></div>
  </aside>
</div>
<script>
const canvas=document.getElementById('canvas'),wrap=document.getElementById('wrap'),sel=document.getElementById('selected'),comment=document.getElementById('comment'),items=document.getElementById('items');let current=null,scale=1,tx=0,ty=0,drag=false,lastX=0,lastY=0;const feedback=[];
function apply(){canvas.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function select(el){document.querySelectorAll('.va-selected').forEach(x=>x.classList.remove('va-selected'));current=el;if(el){el.classList.add('va-selected');sel.textContent=el.dataset.vaLabel||el.dataset.vaId;comment.focus()}else sel.textContent='Nothing selected'}
document.querySelectorAll('[data-va-id]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();select(el)}));wrap.addEventListener('click',e=>{if(!e.target.closest('[data-va-id]'))select(null)});
document.getElementById('add').onclick=()=>{const text=comment.value.trim();if(!current||!text)return;feedback.push({elementId:current.dataset.vaId,elementLabel:current.dataset.vaLabel||current.dataset.vaId,comment:text,createdAt:new Date().toISOString()});comment.value='';render()};
function render(){if(!feedback.length){items.className='empty';items.textContent='No feedback yet.';return}items.className='';items.innerHTML=feedback.map((f,i)=>`<div class="item"><b>${escapeHtml(f.elementLabel)}</b><div>${escapeHtml(f.comment)}</div><small>${new Date(f.createdAt).toLocaleString()}</small></div>`).join('')}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
document.getElementById('zoomIn').onclick=()=>{scale=Math.min(2.5,scale+.15);apply()};document.getElementById('zoomOut').onclick=()=>{scale=Math.max(.35,scale-.15);apply()};document.getElementById('reset').onclick=()=>{scale=1;tx=0;ty=0;apply()};
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('[data-va-id]'))return;drag=true;lastX=e.clientX;lastY=e.clientY;canvas.classList.add('dragging');wrap.setPointerCapture(e.pointerId)});wrap.addEventListener('pointermove',e=>{if(!drag)return;tx+=e.clientX-lastX;ty+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;apply()});wrap.addEventListener('pointerup',()=>{drag=false;canvas.classList.remove('dragging')});
wrap.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();scale=Math.max(.35,Math.min(2.5,scale+(e.deltaY<0?.1:-.1)));apply()},{passive:false});
function json(){return JSON.stringify({schema:'visual-architect/review@1',artifact:document.title,feedback},null,2)}
document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(json());document.getElementById('copy').textContent='Copied';setTimeout(()=>document.getElementById('copy').textContent='Copy feedback JSON',1200)};
document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json()],{type:'application/json'}));a.download='visual-architect-feedback.json';a.click();URL.revokeObjectURL(a.href)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')select(null);if((e.ctrlKey||e.metaKey)&&e.key==='0'){e.preventDefault();scale=1;tx=0;ty=0;apply()}});
</script>
</body>
</html>
