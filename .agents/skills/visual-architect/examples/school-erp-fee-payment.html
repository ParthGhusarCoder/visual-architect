<title>Visual Architect — Review Studio</title>
<style>
:root{--bg:#080b14;--bg2:#0c1120;--panel:rgba(14,20,36,.94);--panel2:#121a2d;--surface:#172138;--surface2:#1d2944;--text:#f4f7ff;--muted:#95a3bf;--line:#26334e;--grid:rgba(145,164,198,.09);--accent:#8b7cff;--accent2:#5ee7f1;--success:#4adea6;--warning:#ffc76a;--danger:#ff7b91;--shadow:0 24px 80px rgba(0,0,0,.38);--node:#18243c;--client:#162a3c;--service:#211f43;--store:#17313a;--external:#33243a;--edge:#7080a0}
[data-theme="light"]{--bg:#eef2f8;--bg2:#f7f9fc;--panel:rgba(255,255,255,.96);--panel2:#f7f9fc;--surface:#fff;--surface2:#f4f6fb;--text:#142039;--muted:#66728a;--line:#d8dfeb;--grid:rgba(80,100,140,.10);--accent:#6857e8;--accent2:#0e9fb1;--success:#15966b;--warning:#ad6b00;--danger:#d64c68;--shadow:0 24px 60px rgba(45,60,90,.16);--node:#fff;--client:#edf8fb;--service:#f1efff;--store:#ecfaf4;--external:#fff0f5;--edge:#73809a}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea{font:inherit}button{color:inherit}.app{height:100%;display:grid;grid-template-rows:64px minmax(0,1fr)}
.topbar{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(18px);z-index:20}.brand{display:flex;align-items:center;gap:10px;min-width:0}.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),#5a6ff0 55%,var(--accent2));box-shadow:0 8px 26px color-mix(in srgb,var(--accent) 35%,transparent);font-weight:850;color:white;letter-spacing:-.04em}.brandcopy{min-width:0}.brandname{font-size:13px;font-weight:800;letter-spacing:.01em}.artifact{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}.spacer{flex:1}.meta{display:flex;gap:7px;align-items:center}.chip{height:28px;padding:0 9px;border:1px solid var(--line);border-radius:999px;display:inline-flex;align-items:center;gap:6px;background:var(--panel2);color:var(--muted);font-size:12px;font-weight:650}.dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 13%,transparent)}.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;cursor:pointer;transition:.15s ease}.iconbtn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--surface2);transform:translateY(-1px)}.iconbtn:active{transform:none}.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;transition:grid-template-columns .22s ease}.workspace.panel-hidden{grid-template-columns:minmax(0,1fr) 0}.viewport{position:relative;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--accent) 6%,transparent),transparent 42%),var(--bg)}.viewport:before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:22px 22px;pointer-events:none}.paper{position:absolute;left:50%;top:50%;width:1200px;height:760px;transform-origin:center center;background:var(--bg2);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;will-change:transform}.paper svg{display:block;width:100%;height:100%}.paper.dragging{cursor:grabbing}.viewport.pannable{cursor:grab}
.floating{position:absolute;z-index:8;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(14px);box-shadow:0 12px 35px rgba(0,0,0,.15)}.zoomdock{left:16px;bottom:16px;border-radius:13px;padding:5px}.zoomdock button{width:32px;height:32px;border:0;border-radius:9px;background:transparent;cursor:pointer;color:var(--muted);font-weight:800}.zoomdock button:hover{background:var(--surface2);color:var(--text)}.zoomvalue{width:54px;text-align:center;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.selection-pill{top:16px;left:16px;max-width:min(520px,calc(100% - 32px));padding:8px 10px;border-radius:12px;opacity:0;transform:translateY(-5px);pointer-events:none;transition:.15s ease}.selection-pill.show{opacity:1;transform:none}.selection-pill b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.selection-pill code{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);padding-left:8px}
.inspector{min-width:0;border-left:1px solid var(--line);background:var(--panel);backdrop-filter:blur(20px);overflow:auto;transition:opacity .18s ease,transform .22s ease}.panel-hidden .inspector{opacity:0;pointer-events:none;transform:translateX(20px)}.panel-head{padding:18px 18px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);backdrop-filter:blur(18px);z-index:4}.panel-kicker{display:flex;align-items:center;justify-content:space-between;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:800;font-size:10px}.review-count{padding:3px 7px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:color-mix(in srgb,var(--accent) 80%,var(--text));letter-spacing:0}.selection-card{margin-top:12px;padding:12px;border:1px solid var(--line);background:var(--panel2);border-radius:14px}.selection-title{font-size:16px;font-weight:800;letter-spacing:-.015em}.selection-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.mini{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);background:var(--surface2);border-radius:6px;padding:3px 6px}.panel-body{padding:16px 18px 30px}.label{display:block;font-size:11px;color:var(--muted);font-weight:750;margin:0 0 7px}.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.quick button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:999px;padding:5px 8px;font-size:11px;cursor:pointer}.quick button:hover{border-color:var(--accent);color:var(--text)}textarea{width:100%;min-height:112px;border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:var(--bg2);color:var(--text);outline:none;resize:vertical;transition:.15s ease}textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}textarea::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}.row{display:flex;gap:8px;margin-top:9px}.primary,.secondary{height:38px;border-radius:11px;font-weight:750;cursor:pointer}.primary{flex:1;border:0;color:white;background:linear-gradient(135deg,var(--accent),#6277ef);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 24%,transparent)}.primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.secondary{padding:0 11px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}.section{margin-top:22px;padding-top:17px;border-top:1px solid var(--line)}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.section-title{font-size:12px;font-weight:800}.textbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:11px}.textbtn:hover{color:var(--text)}.empty{border:1px dashed var(--line);border-radius:13px;padding:18px 12px;text-align:center;color:var(--muted);font-size:12px}.review-item{position:relative;border:1px solid var(--line);border-radius:13px;padding:11px 38px 11px 11px;background:var(--panel2);margin-top:8px}.review-item.resolved{opacity:.6}.review-top{display:flex;gap:7px;align-items:center;margin-bottom:5px}.review-top b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:850;padding:3px 5px;border-radius:5px;background:color-mix(in srgb,var(--warning) 14%,transparent);color:var(--warning)}.resolved .status{background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}.review-text{font-size:12px;color:var(--text);white-space:pre-wrap}.review-time{margin-top:6px;font-size:10px;color:var(--muted)}.item-actions{position:absolute;right:7px;top:8px;display:grid;gap:3px}.tinybtn{width:25px;height:25px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer}.tinybtn:hover{background:var(--surface2);color:var(--text)}.export-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.export-grid button{height:36px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--muted);cursor:pointer;font-weight:700;font-size:11px}.export-grid button:hover{color:var(--text);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}.footnote{margin-top:12px;color:var(--muted);font-size:10px}.toast{position:fixed;left:50%;bottom:24px;z-index:50;transform:translate(-50%,12px);opacity:0;padding:9px 12px;border-radius:10px;background:var(--text);color:var(--bg);font-size:12px;font-weight:750;box-shadow:var(--shadow);transition:.18s ease;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
/* Diagram vocabulary: agents can reuse these classes instead of repeating inline styles. */
.va-svg text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--text)}.va-title{font-size:29px;font-weight:850;letter-spacing:-.025em}.va-subtitle{font-size:13px;fill:var(--muted)!important}.zone{fill:color-mix(in srgb,var(--surface) 30%,transparent);stroke:var(--line);stroke-dasharray:6 7}.zone-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)!important}.node .surface{fill:var(--node);stroke:var(--line);stroke-width:1.3;transition:.14s ease}.node.client .surface{fill:var(--client)}.node.service .surface{fill:var(--service)}.node.store .surface{fill:var(--store)}.node.external .surface{fill:var(--external)}.node-title{font-size:14px;font-weight:800}.node-sub{font-size:10.5px;fill:var(--muted)!important}.node-badge{font-size:9px;font-weight:800;letter-spacing:.04em;fill:var(--muted)!important}.edge{fill:none;stroke:var(--edge);stroke-width:2;vector-effect:non-scaling-stroke}.edge.dashed{stroke-dasharray:7 6}.edge-label{font-size:10px;font-weight:650;fill:var(--muted)!important}.edge-step{fill:var(--accent);stroke:var(--bg2);stroke-width:2}.edge-step-text{font-size:9px;font-weight:850;fill:white!important}.note{fill:color-mix(in srgb,var(--warning) 10%,var(--bg2));stroke:color-mix(in srgb,var(--warning) 45%,var(--line));stroke-dasharray:4 5}.note-text{font-size:10px;fill:var(--warning)!important}[data-va-id]{cursor:pointer}.node.va-selected .surface{stroke:var(--accent)!important;stroke-width:2.5;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--accent) 35%,transparent))}.edge-group.va-selected .edge{stroke:var(--accent)!important;stroke-width:3;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--accent) 45%,transparent))}
@media(max-width:900px){.meta .optional{display:none}.artifact{max-width:38vw}.workspace{grid-template-columns:1fr}.inspector{position:fixed;z-index:30;left:10px;right:10px;bottom:10px;max-height:57vh;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);transform:translateY(calc(100% + 20px));opacity:0;pointer-events:none}.workspace:not(.panel-hidden) .inspector{transform:none;opacity:1;pointer-events:auto}.workspace.panel-hidden{grid-template-columns:1fr}.panel-hidden .inspector{transform:translateY(calc(100% + 20px))}.paper{border-radius:16px}.topbar{padding:0 10px}.chip.optional{display:none}}@media(max-width:560px){.app{grid-template-rows:58px 1fr}.brandname{display:none}.artifact{max-width:46vw}.meta{display:none}.paper{width:1080px;height:684px}.selection-pill{top:10px;left:10px}.zoomdock{left:10px;bottom:10px}}
</style>
</head>
<body>
<script id="va-meta" type="application/json">{"title":"School ERP \u2014 Online Fee Payment","type":"Data Flow","revision":"r1","status":"Ready for review"}</script>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="mark">VA</div><div class="brandcopy"><div class="brandname">Visual Architect</div><div class="artifact" id="artifactTitle">Diagram</div></div></div>
    <div class="spacer"></div>
    <div class="meta"><span class="chip optional" id="typeChip">Architecture</span><span class="chip optional" id="revisionChip">r1</span><span class="chip"><span class="dot"></span><span id="statusChip">Ready</span></span></div>
    <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.4 0-.8-.1-1.2A7 7 0 0 1 13.2 3H12Z"/></svg></button>
    <button class="iconbtn" id="togglePanel" title="Toggle review panel" aria-label="Toggle review panel"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM15 5v14"/></svg></button>
  </header>
  <main class="workspace" id="workspace">
    <section class="viewport pannable" id="viewport" aria-label="Diagram canvas">
      <div class="selection-pill floating" id="selectionPill"><b id="selectionPillLabel"></b><code id="selectionPillId"></code></div>
      <div class="paper" id="paper">
<!-- VA:DIAGRAM_START -->
<svg class="va-svg" id="diagram" viewBox="0 0 1200 760" role="img" aria-labelledby="va-title va-desc">
  <title id="va-title">School ERP online fee payment data flow</title>
  <desc id="va-desc">A parent pays fees through the ERP API and Fees Service, which talks to an external payment gateway, processes the webhook, updates the database, and triggers receipt and notification services.</desc>
  <defs><marker id="va-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--edge)"/></marker></defs>
  <text class="va-title" x="58" y="68">Online Fee Payment</text>
  <text class="va-subtitle" x="58" y="94">School ERP · payment request, gateway webhook, settlement, receipt &amp; notification</text>
  <rect class="zone" x="42" y="150" width="220" height="500" rx="20"/><text class="zone-label" x="62" y="180">USER</text>
  <rect class="zone" x="290" y="150" width="590" height="500" rx="20"/><text class="zone-label" x="310" y="180">SCHOOL ERP</text>
  <rect class="zone" x="910" y="150" width="245" height="500" rx="20"/><text class="zone-label" x="930" y="180">EXTERNAL</text>
  <g class="node client" data-va-id="client-parent" data-va-label="Parent App" data-va-kind="client"><rect class="surface" x="72" y="304" width="160" height="96" rx="16"/><text class="node-title" x="92" y="340">Parent App</text><text class="node-sub" x="92" y="365">Starts fee payment</text><text class="node-badge" x="92" y="383">MOBILE / WEB</text></g>
  <g class="node service" data-va-id="api-erp" data-va-label="ERP API" data-va-kind="service"><rect class="surface" x="328" y="304" width="160" height="96" rx="16"/><text class="node-title" x="348" y="340">ERP API</text><text class="node-sub" x="348" y="365">Auth &amp; request routing</text><text class="node-badge" x="348" y="383">API</text></g>
  <g class="node service" data-va-id="service-fees" data-va-label="Fees Service" data-va-kind="service"><rect class="surface" x="560" y="304" width="180" height="96" rx="16"/><text class="node-title" x="580" y="340">Fees Service</text><text class="node-sub" x="580" y="365">Order &amp; payment state</text><text class="node-badge" x="580" y="383">CORE SERVICE</text></g>
  <g class="node external" data-va-id="gateway-payment" data-va-label="Payment Gateway" data-va-kind="external"><rect class="surface" x="944" y="304" width="176" height="96" rx="16"/><text class="node-title" x="964" y="340">Payment Gateway</text><text class="node-sub" x="964" y="365">Hosted payment</text><text class="node-badge" x="964" y="383">EXTERNAL</text></g>
  <g class="node store" data-va-id="db-fees" data-va-label="Fees Database" data-va-kind="database"><rect class="surface" x="535" y="500" width="165" height="92" rx="16"/><text class="node-title" x="555" y="535">Fees Database</text><text class="node-sub" x="555" y="560">Payment &amp; receipt state</text><text class="node-badge" x="555" y="578">DATA STORE</text></g>
  <g class="node service" data-va-id="service-receipt" data-va-label="Receipt Service" data-va-kind="service"><rect class="surface" x="725" y="452" width="140" height="84" rx="15"/><text class="node-title" x="745" y="485">Receipt</text><text class="node-sub" x="745" y="509">Generate document</text></g>
  <g class="node service" data-va-id="service-notification" data-va-label="Notification Service" data-va-kind="service"><rect class="surface" x="725" y="558" width="140" height="84" rx="15"/><text class="node-title" x="745" y="591">Notification</text><text class="node-sub" x="745" y="615">Push / SMS / email</text></g>
  <g class="edge-group" data-va-id="flow-pay-request" data-va-label="Parent → ERP API: Pay fee" data-va-kind="flow"><path class="edge" d="M232 352 H328" marker-end="url(#va-arrow)"/><circle class="edge-step" cx="274" cy="352" r="10"/><text class="edge-step-text" x="274" y="355" text-anchor="middle">1</text><text class="edge-label" x="250" y="333">Pay fee</text></g>
  <g class="edge-group" data-va-id="flow-create-order" data-va-label="ERP API → Fees Service: Create order" data-va-kind="flow"><path class="edge" d="M488 352 H560" marker-end="url(#va-arrow)"/><circle class="edge-step" cx="522" cy="352" r="10"/><text class="edge-step-text" x="522" y="355" text-anchor="middle">2</text><text class="edge-label" x="493" y="333">Create order</text></g>
  <g class="edge-group" data-va-id="flow-gateway-order" data-va-label="Fees Service → Payment Gateway: Create payment" data-va-kind="flow"><path class="edge" d="M740 340 C812 315 860 315 944 340" marker-end="url(#va-arrow)"/><circle class="edge-step" cx="839" cy="318" r="10"/><text class="edge-step-text" x="839" y="321" text-anchor="middle">3</text><text class="edge-label" x="790" y="294">Create payment</text></g>
  <g class="edge-group" data-va-id="flow-webhook" data-va-label="Payment Gateway → Fees Service: Webhook" data-va-kind="webhook"><path class="edge dashed" d="M944 384 C870 432 810 438 740 386" marker-end="url(#va-arrow)"/><circle class="edge-step" cx="839" cy="424" r="10"/><text class="edge-step-text" x="839" y="427" text-anchor="middle">4</text><text class="edge-label" x="805" y="448">Webhook</text></g>
  <g class="edge-group" data-va-id="flow-update-db" data-va-label="Fees Service → Fees Database: Mark paid" data-va-kind="flow"><path class="edge" d="M650 400 C650 448 618 462 618 500" marker-end="url(#va-arrow)"/><circle class="edge-step" cx="641" cy="451" r="10"/><text class="edge-step-text" x="641" y="454" text-anchor="middle">5</text><text class="edge-label" x="652" y="468">Mark paid</text></g>
  <g class="edge-group" data-va-id="flow-receipt" data-va-label="Fees Service → Receipt Service" data-va-kind="flow"><path class="edge" d="M740 385 C755 405 775 425 790 452" marker-end="url(#va-arrow)"/><circle class="edge-step" cx="775" cy="415" r="10"/><text class="edge-step-text" x="775" y="418" text-anchor="middle">6</text></g>
  <g class="edge-group" data-va-id="flow-notification" data-va-label="Fees Service → Notification Service" data-va-kind="flow"><path class="edge" d="M700 400 C714 482 730 532 765 558" marker-end="url(#va-arrow)"/><circle class="edge-step" cx="742" cy="500" r="10"/><text class="edge-step-text" x="742" y="503" text-anchor="middle">7</text></g>
  <g><rect class="note" x="944" y="485" width="176" height="86" rx="14"/><text class="note-text" x="962" y="514">Assumption</text><text class="node-sub" x="962" y="539">Gateway vendor is not</text><text class="node-sub" x="962" y="558">specified; kept generic.</text></g>
</svg>
<!-- VA:DIAGRAM_END -->
      </div>
      <div class="selection-pill floating" style="display:none"></div>
      <div class="zoomdock floating"><button id="zoomOut" title="Zoom out">−</button><span class="zoomvalue" id="zoomValue">100%</span><button id="zoomIn" title="Zoom in">+</button><button id="fit" title="Fit diagram">Fit</button></div>
    </section>
    <aside class="inspector" id="inspector">
      <div class="panel-head">
        <div class="panel-kicker"><span>Review Studio</span><span class="review-count" id="reviewCount">0 open</span></div>
        <div class="selection-card"><div class="selection-title" id="selectedLabel">Whole diagram</div><div class="selection-meta"><span class="mini" id="selectedId">diagram</span><span class="mini" id="selectedKind">general</span></div></div>
      </div>
      <div class="panel-body">
        <label class="label" for="comment">Feedback for selected element</label>
        <div class="quick"><button data-quick="Rename: ">Rename</button><button data-quick="Missing flow: ">Missing flow</button><button data-quick="Clarify: ">Clarify</button><button data-quick="Mark as assumption: ">Assumption</button></div>
        <textarea id="comment" placeholder="Be specific — e.g. show the payment webhook returning to Fees Service."></textarea>
        <div class="row"><button class="primary" id="addFeedback">Add feedback</button><button class="secondary" id="generalBtn" title="Comment on the whole diagram">General</button></div>

        <section class="section"><div class="section-head"><span class="section-title">Feedback</span><button class="textbtn" id="clearResolved">Clear resolved</button></div><div id="feedbackList" class="empty">No feedback yet. Click a diagram element to start.</div></section>
        <section class="section"><div class="section-head"><span class="section-title">Export review</span></div><div class="export-grid"><button id="copyJson">Copy JSON</button><button id="downloadJson">Download JSON</button></div><div class="footnote">Saved locally in this browser. Press <b>0</b> to fit, <b>Esc</b> to clear selection.</div></section>
      </div>
    </aside>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s), viewport=$('#viewport'),paper=$('#paper'),workspace=$('#workspace'),comment=$('#comment');
let meta={};try{meta=JSON.parse($('#va-meta').textContent)}catch{};
$('#artifactTitle').textContent=meta.title||'Untitled diagram';document.title=`${meta.title||'Visual Architect'} — Review Studio`;$('#typeChip').textContent=meta.type||'Diagram';$('#revisionChip').textContent=meta.revision||'r1';$('#statusChip').textContent=meta.status||'Ready';
const storageKey=`visual-architect:review:${meta.title||location.pathname}`;const safeGet=k=>{try{return localStorage.getItem(k)}catch{return null}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};let feedback=[];try{feedback=JSON.parse(safeGet(storageKey)||'[]')}catch{};
let current={id:'diagram',label:'Whole diagram',kind:'general'},scale=1,tx=0,ty=0,drag=false,lastX=0,lastY=0,toastTimer;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1300)}
function persist(){safeSet(storageKey,JSON.stringify(feedback))}
function setTheme(t){document.documentElement.dataset.theme=t;safeSet('visual-architect:theme',t)}
const preferred=safeGet('visual-architect:theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');setTheme(preferred);
$('#themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
function apply(){paper.style.transform=`translate(-50%,-50%) translate(${tx}px,${ty}px) scale(${scale})`;$('#zoomValue').textContent=`${Math.round(scale*100)}%`}
function fit(){const pw=paper.offsetWidth,ph=paper.offsetHeight,pad=52;scale=Math.min((viewport.clientWidth-pad)/pw,(viewport.clientHeight-pad)/ph,1.15);scale=Math.max(.28,scale);tx=0;ty=0;apply()}
function zoom(delta){scale=Math.max(.28,Math.min(2.4,scale+delta));apply()}
$('#zoomIn').onclick=()=>zoom(.12);$('#zoomOut').onclick=()=>zoom(-.12);$('#fit').onclick=fit;window.addEventListener('resize',()=>{if(innerWidth<560&&scale<.3)fit()});requestAnimationFrame(fit);
function selectElement(el){document.querySelectorAll('.va-selected').forEach(x=>x.classList.remove('va-selected'));if(el){el.classList.add('va-selected');current={id:el.dataset.vaId,label:el.dataset.vaLabel||el.dataset.vaId,kind:el.dataset.vaKind||'element'};if(innerWidth<=900)workspace.classList.remove('panel-hidden');$('#selectionPill').classList.add('show');$('#selectionPillLabel').textContent=current.label;$('#selectionPillId').textContent=current.id}else{current={id:'diagram',label:'Whole diagram',kind:'general'};$('#selectionPill').classList.remove('show')}$('#selectedLabel').textContent=current.label;$('#selectedId').textContent=current.id;$('#selectedKind').textContent=current.kind}
viewport.addEventListener('click',e=>{const el=e.target.closest('[data-va-id]');if(el){e.stopPropagation();selectElement(el)}});$('#generalBtn').onclick=()=>{selectElement(null);comment.focus()};
viewport.addEventListener('pointerdown',e=>{if(e.target.closest('[data-va-id]')||e.button!==0)return;drag=true;lastX=e.clientX;lastY=e.clientY;paper.classList.add('dragging');viewport.setPointerCapture(e.pointerId)});viewport.addEventListener('pointermove',e=>{if(!drag)return;tx+=e.clientX-lastX;ty+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;apply()});viewport.addEventListener('pointerup',()=>{drag=false;paper.classList.remove('dragging')});viewport.addEventListener('pointercancel',()=>{drag=false;paper.classList.remove('dragging')});viewport.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();zoom(e.deltaY<0?.08:-.08)},{passive:false});
document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{comment.value=(comment.value?comment.value+'\n':'')+b.dataset.quick;comment.focus()});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){const open=feedback.filter(x=>x.status!=='resolved').length;$('#reviewCount').textContent=`${open} open`;const list=$('#feedbackList');if(!feedback.length){list.className='empty';list.textContent='No feedback yet. Click a diagram element to start.';return}list.className='';list.innerHTML=feedback.map((f,i)=>`<article class="review-item ${f.status==='resolved'?'resolved':''}"><div class="review-top"><span class="status">${f.status==='resolved'?'Resolved':'Open'}</span><b title="${esc(f.elementId)}">${esc(f.elementLabel)}</b></div><div class="review-text">${esc(f.comment)}</div><div class="review-time">${new Date(f.createdAt).toLocaleString()} · ${esc(f.elementId)}</div><div class="item-actions"><button class="tinybtn" data-resolve="${i}" title="${f.status==='resolved'?'Reopen':'Resolve'}">${f.status==='resolved'?'↺':'✓'}</button><button class="tinybtn" data-delete="${i}" title="Delete">×</button></div></article>`).join('');list.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=()=>{const f=feedback[+b.dataset.resolve];f.status=f.status==='resolved'?'open':'resolved';persist();render()});list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{feedback.splice(+b.dataset.delete,1);persist();render()})}
$('#addFeedback').onclick=()=>{const text=comment.value.trim();if(!text){toast('Write feedback first');return}feedback.push({elementId:current.id,elementLabel:current.label,elementKind:current.kind,comment:text,status:'open',revision:meta.revision||'r1',createdAt:new Date().toISOString()});comment.value='';persist();render();toast('Feedback added')};
$('#clearResolved').onclick=()=>{feedback=feedback.filter(x=>x.status!=='resolved');persist();render();toast('Resolved feedback cleared')};
function reviewJson(){return JSON.stringify({schema:'visual-architect/review@1',artifact:{title:meta.title||document.title,type:meta.type||null,revision:meta.revision||null},summary:{open:feedback.filter(x=>x.status!=='resolved').length,resolved:feedback.filter(x=>x.status==='resolved').length},feedback},null,2)}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();document.execCommand('copy');a.remove()}}
$('#copyJson').onclick=async()=>{await copyText(reviewJson());toast('Review JSON copied')};$('#downloadJson').onclick=()=>{const blob=new Blob([reviewJson()],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='visual-architect-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Review JSON downloaded')};
$('#togglePanel').onclick=()=>workspace.classList.toggle('panel-hidden');document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;if(e.key==='Escape')selectElement(null);if(e.key==='0'){e.preventDefault();fit()}if(e.key==='+'||e.key==='=')zoom(.12);if(e.key==='-')zoom(-.12);if(e.key.toLowerCase()==='r')workspace.classList.toggle('panel-hidden')});
if(innerWidth<=900)workspace.classList.add('panel-hidden');selectElement(null);render();
})();
</script>
</body>
</html>
